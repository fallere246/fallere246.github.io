<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>山手線内回り酒カスツアー</title>
  <meta name="description" content="サイコロを振って山手線内回りで次に飲む駅を決める。一周したらゴール。">
  <meta name="theme-color" content="#80c241">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6ef;
      --card: #ffffff;
      --text: #1d2318;
      --muted: #69725f;
      --border: #dfe4d6;
      --line: #80c241;
      --line-dark: #4f8a1a;
      --accent: #e8a317;
      --danger: #c8442f;
      --dot: #ffffff;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(40,60,20,.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12150f;
        --card: #1c2118;
        --text: #e9eee2;
        --muted: #9aa58e;
        --border: #2f3729;
        --line: #8fd14c;
        --line-dark: #b5e884;
        --accent: #f2b63a;
        --danger: #f07a63;
        --dot: #1c2118;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    header h1 {
      margin: 0;
      min-width: 0;
      font-size: clamp(1.25rem, 4.5vw, 1.7rem);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-grid;
      place-items: center;
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: var(--line);
      color: #fff;
      font-size: .8em;
      font-weight: 700;
      flex: none;
    }
    a.back { color: var(--muted); font-size: .85rem; text-decoration: none; white-space: nowrap; }
    a.back:hover { color: var(--text); }

    .layout {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr);
    }
    @media (min-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
      .map-card { position: sticky; top: 16px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .08em;
    }

    /* 路線図 */
    .map-card svg { width: 100%; height: auto; display: block; }
    .route { fill: none; stroke: var(--line); stroke-width: 7; stroke-linejoin: round; opacity: .35; }
    .route-done { fill: none; stroke: var(--line); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
    .st circle { fill: var(--dot); stroke: var(--line-dark); stroke-width: 2.5; transition: r .2s; }
    .st text { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 3px; }
    .st.visited circle { fill: var(--accent); stroke: var(--accent); }
    .st.visited text { fill: var(--text); font-weight: 600; }
    .st.start circle { fill: var(--line-dark); stroke: var(--line-dark); }
    .st.current text { fill: var(--text); font-weight: 700; font-size: 12px; }
    .st { cursor: pointer; }
    .train { transition: transform .22s ease-in-out; }
    .train circle.pulse { fill: var(--accent); opacity: .3; animation: pulse 1.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .train circle.core { fill: var(--accent); stroke: #fff; stroke-width: 2.5; }
    @keyframes pulse { from { transform: scale(.6); opacity: .5; } to { transform: scale(1.8); opacity: 0; } }
    .map-center-title { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .map-center-big { font-size: 26px; font-weight: 700; fill: var(--text); text-anchor: middle; }
    .map-center-sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }

    /* 進捗 */
    .progress { margin-top: 12px; }
    .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--line), var(--accent)); transition: width .4s; }
    .progress-meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; }

    /* 現在地とサイコロ */
    .now { text-align: center; }
    .now .label { font-size: .8rem; color: var(--muted); }
    .now .station { font-size: clamp(2rem, 9vw, 2.6rem); font-weight: 800; line-height: 1.2; letter-spacing: .04em; }
    .now .next { font-size: .85rem; color: var(--muted); min-height: 1.4em; }

    .dice-area { display: flex; justify-content: center; padding: 26px 0 22px; perspective: 600px; }
    .dice {
      --s: 76px;
      width: var(--s); height: var(--s);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(25deg);
      transition: transform 1.1s cubic-bezier(.2,.8,.25,1);
    }
    .face {
      position: absolute; inset: 0;
      background: #fffdf7;
      border: 1px solid #e2dccb;
      border-radius: 14px;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,.08);
    }
    .face i { width: 13px; height: 13px; border-radius: 50%; background: #222; place-self: center; }
    .face.f1 i { background: var(--danger); width: 18px; height: 18px; }
    .f1 { transform: translateZ(calc(var(--s) / 2)); }
    .f6 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
    .f2 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
    .f5 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
    .f3 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
    .f4 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 14px 20px;
      transition: transform .08s, opacity .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { width: 100%; background: var(--line-dark); color: #fff; font-size: 1.15rem; }
    @media (prefers-color-scheme: dark) { .btn-primary { background: var(--line); color: #10200a; } }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 9px 14px; font-weight: 600; font-size: .88rem; }
    .btn-ghost:hover { color: var(--text); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .row .btn-ghost { flex: 1; }

    .mission {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent);
      font-size: .95rem;
      display: none;
    }
    .mission.show { display: block; animation: pop .35s ease-out; }
    .mission b { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
    @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

    /* 設定 */
    .setup label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
    select {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .check { display: flex !important; align-items: center; gap: 8px; color: var(--text) !important; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--line-dark); }

    /* 記録 */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { text-align: center; padding: 8px 4px; border-radius: 10px; background: color-mix(in srgb, var(--line) 10%, transparent); }
    .stat .v { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
    .stat .k { font-size: .72rem; color: var(--muted); }
    ol.log { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
    ol.log li {
      display: grid;
      grid-template-columns: 2.2em 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 8px 2px;
      border-bottom: 1px solid var(--border);
      font-size: .92rem;
    }
    ol.log li:last-child { border-bottom: 0; }
    ol.log .n { color: var(--muted); font-size: .78rem; text-align: right; }
    ol.log .s { font-weight: 700; }
    ol.log .m { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }
    ol.log .t { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    ol.log .d { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 4px; background: var(--border); font-size: .75rem; margin-right: 4px; vertical-align: 1px; }
    .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 16px 0; }

    /* ゴール */
    .goal {
      position: fixed; inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.45);
      padding: 16px;
      z-index: 10;
    }
    .goal.show { display: grid; }
    .goal .card { max-width: 380px; width: 100%; text-align: center; animation: pop .4s ease-out; }
    .goal .big { font-size: 3rem; line-height: 1.1; }
    .goal h3 { margin: 8px 0 4px; font-size: 1.4rem; }
    .goal p { margin: 0 0 14px; color: var(--muted); }
    .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg);
      padding: 10px 16px; border-radius: 99px; font-size: .88rem;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer { margin-top: 24px; text-align: center; font-size: .78rem; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span class="badge" aria-hidden="true">JY</span>山手線内回り酒カスツアー</h1>
      <a class="back" href="/">← 一覧へ</a>
    </header>

    <div class="layout">
      <section class="card map-card" aria-label="路線図">
        <svg id="map" viewBox="0 0 400 400" role="img" aria-label="山手線の路線図と現在地"></svg>
        <div class="progress">
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <div class="progress-meta"><span id="progress-text">0 / 30 駅</span><span id="progress-rest">一周まであと 30 駅</span></div>
        </div>
      </section>

      <div style="display:grid;gap:16px;min-width:0">
        <section class="card now" aria-live="polite">
          <div class="label" id="now-label">スタート駅</div>
          <div class="station" id="now-station">東京</div>
          <div class="next" id="now-next">次の駅は 神田</div>

          <div class="dice-area">
            <div class="dice" id="dice" aria-hidden="true">
              <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
              <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
            </div>
          </div>

          <button class="btn btn-primary" id="roll">🎲 サイコロを振る</button>
          <div class="mission" id="mission"><b>この駅のお題</b><span id="mission-text"></span></div>
          <div class="row">
            <button class="btn btn-ghost" id="undo">ひとつ戻す</button>
            <button class="btn btn-ghost" id="share">記録をコピー</button>
            <button class="btn btn-ghost" id="reset">最初から</button>
          </div>
        </section>

        <section class="card setup" id="setup">
          <h2>設定</h2>
          <label for="start">スタート駅（路線図の駅をタップしても選べます）</label>
          <select id="start"></select>
          <label class="check"><input type="checkbox" id="opt-mission" checked> 駅ごとにお題を出す</label>
          <label class="check"><input type="checkbox" id="opt-lap" checked> 一周したらゴール</label>
        </section>

        <section class="card">
          <h2>ツアー記録</h2>
          <div class="stats">
            <div class="stat"><div class="v" id="st-stops">0</div><div class="k">軒目</div></div>
            <div class="stat"><div class="v" id="st-dist">0</div><div class="k">進んだ駅数</div></div>
            <div class="stat"><div class="v" id="st-time">0:00</div><div class="k">経過時間</div></div>
          </div>
          <ol class="log" id="log"></ol>
        </section>
      </div>
    </div>

    <footer>飲みすぎ注意。お酒は20歳になってから。水も飲もう。</footer>
  </main>

  <div class="goal" id="goal" role="dialog" aria-modal="true" aria-labelledby="goal-title">
    <div class="card">
      <div class="big">🍻</div>
      <h3 id="goal-title">一周達成！</h3>
      <p id="goal-text"></p>
      <button class="btn btn-primary" id="goal-close">続けて飲む</button>
      <div class="row"><button class="btn btn-ghost" id="goal-share">記録をコピー</button><button class="btn btn-ghost" id="goal-reset">最初から</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {
    // 内回り（反時計回り）の順。緯度経度はおおよその駅位置で、路線図の形を作るのに使う
    const STATIONS = [
      ['東京', 35.6812, 139.7671], ['神田', 35.6918, 139.7709], ['秋葉原', 35.6984, 139.7731],
      ['御徒町', 35.7074, 139.7748], ['上野', 35.7138, 139.7773], ['鶯谷', 35.7210, 139.7780],
      ['日暮里', 35.7281, 139.7710], ['西日暮里', 35.7320, 139.7668], ['田端', 35.7381, 139.7608],
      ['駒込', 35.7365, 139.7470], ['巣鴨', 35.7334, 139.7393], ['大塚', 35.7318, 139.7286],
      ['池袋', 35.7295, 139.7109], ['目白', 35.7212, 139.7066], ['高田馬場', 35.7128, 139.7038],
      ['新大久保', 35.7013, 139.7000], ['新宿', 35.6896, 139.7006], ['代々木', 35.6830, 139.7020],
      ['原宿', 35.6702, 139.7027], ['渋谷', 35.6580, 139.7016], ['恵比寿', 35.6467, 139.7101],
      ['目黒', 35.6339, 139.7158], ['五反田', 35.6262, 139.7236], ['大崎', 35.6197, 139.7286],
      ['品川', 35.6285, 139.7388], ['高輪ゲートウェイ', 35.6355, 139.7407], ['田町', 35.6457, 139.7476],
      ['浜松町', 35.6555, 139.7570], ['新橋', 35.6663, 139.7583], ['有楽町', 35.6751, 139.7630],
    ];
    const N = STATIONS.length;

    const MISSIONS = [
      '改札を出て最初に目に入った店に入る', 'ビールで乾杯', 'ハイボールを1杯', 'レモンサワーを1杯',
      '日本酒を1合', 'その店のおすすめを聞いて頼む', '立ち飲みを探す', 'メニューの一番上を頼む',
      'つまみは1品だけ', '15分で切り上げる', '駅名が入った写真を撮る', 'ここは水を1杯飲む',
      '焼き鳥を1本', '一度も入ったことのない店にする', '店の人に駅のおすすめを聞く', '全員で同じものを頼む',
      'ノンアルで1杯', '次の駅を予想してから振る', '乾杯の音頭を変わりばんこで', '揚げ物を1品',
    ];

    const $ = (id) => document.getElementById(id);
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const KEY = 'yamanote-tour-v2';

    let state = load() || fresh(0);
    let busy = false;

    function fresh(start) {
      return { start, pos: start, dist: 0, log: [], startedAt: null, lapShown: false,
        opts: { mission: true, lap: true } };
    }
    function load() {
      try { const s = JSON.parse(localStorage.getItem(KEY)); return s && typeof s.pos === 'number' ? s : null; }
      catch { return null; }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

    // ---- 路線図 ----
    const svg = $('map');
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs = {}, parent = svg) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    };

    const pts = (() => {
      const lats = STATIONS.map(s => s[1]), lngs = STATIONS.map(s => s[2]);
      const kx = Math.cos(35.69 * Math.PI / 180);
      const minX = Math.min(...lngs) * kx, maxX = Math.max(...lngs) * kx;
      const minY = Math.min(...lats), maxY = Math.max(...lats);
      const W = 400, padX = 70, padY = 26;
      const scale = (W - padX * 2) / (maxX - minX);
      const H = Math.round((maxY - minY) * scale + padY * 2);
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const ox = padX, oy = padY;
      return STATIONS.map(([, lat, lng]) => ({ x: ox + (lng * kx - minX) * scale, y: oy + (maxY - lat) * scale }));
    })();
    // 駅が密集していて放射状だと重なる駅だけ、ラベルの向きを手で決める
    const LABEL_DIR = { '品川': 'e', '高輪ゲートウェイ': 'e', '田町': 'e', '大崎': 's', '五反田': 'w', '目黒': 'w', '日暮里': 'e', '西日暮里': 'n', '田端': 'n' };
    const cx = pts.reduce((a, p) => a + p.x, 0) / N, cy = pts.reduce((a, p) => a + p.y, 0) / N;

    el('polygon', { class: 'route', points: pts.map(p => `${p.x},${p.y}`).join(' ') });
    const done = el('polyline', { class: 'route-done', points: '' });

    const center = el('g');
    el('text', { class: 'map-center-title', x: cx, y: cy - 22 }, center).textContent = '内回り';
    const centerBig = el('text', { class: 'map-center-big', x: cx, y: cy + 8 }, center);
    const centerSub = el('text', { class: 'map-center-sub', x: cx, y: cy + 28 }, center);

    const stEls = STATIONS.map(([name], i) => {
      const p = pts[i];
      const g = el('g', { class: 'st', tabindex: 0, role: 'button', 'aria-label': `${name}をスタート駅にする` });
      el('circle', { cx: p.x, cy: p.y, r: 5 }, g);
      let lx, ly, anchor;
      const dir = LABEL_DIR[name];
      if (dir) {
        lx = p.x + { e: 10, w: -10, s: 0, n: 0 }[dir];
        ly = p.y + { e: 4, w: 4, s: 17, n: -9 }[dir];
        anchor = { e: 'start', w: 'end', s: 'middle', n: 'middle' }[dir];
      } else {
        const dx = p.x - cx, dy = p.y - cy, len = Math.hypot(dx, dy) || 1;
        lx = p.x + dx / len * 12; ly = p.y + dy / len * 12 + 4;
        anchor = Math.abs(dx / len) < 0.3 ? 'middle' : dx > 0 ? 'start' : 'end';
      }
      const t = el('text', { x: lx, y: ly, 'text-anchor': anchor }, g);
      t.textContent = name === '高輪ゲートウェイ' ? '高輪GW' : name;
      const pick = () => { if (!busy && state.log.length === 0) setStart(i); else if (state.log.length) toast('ツアー中はスタート駅を変えられません'); };
      g.addEventListener('click', pick);
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      return g;
    });

    // 進行方向を示す矢印
    const arrowAt = (i) => {
      const a = pts[i], b = pts[(i + 1) % N];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      el('path', { d: 'M-4,-4 L3,0 L-4,4', fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round',
        transform: `translate(${mx},${my}) rotate(${ang})` });
    };
    [2, 12, 19, 26].forEach(arrowAt);

    const train = el('g', { class: 'train' });
    el('circle', { class: 'pulse', r: 11, cx: 0, cy: 0 }, train);
    el('circle', { class: 'core', r: 8, cx: 0, cy: 0 }, train);
    const moveTrain = (i) => train.setAttribute('transform', `translate(${pts[i].x},${pts[i].y})`);

    // ---- サイコロ ----
    const PIPS = { 1: [5], 2: [3, 7], 3: [3, 5, 7], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
    document.querySelectorAll('.face').forEach((f) => {
      const n = +f.className.match(/f(\d)/)[1];
      for (let c = 1; c <= 9; c++) {
        const i = document.createElement('i');
        if (!PIPS[n].includes(c)) i.style.visibility = 'hidden';
        f.appendChild(i);
      }
    });
    // 各面を正面に向けるための回転（X, Y）
    const FACE_ROT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
    let rx = -20, ry = 25;
    const dice = $('dice');
    function spinTo(n) {
      const [tx, ty] = FACE_ROT[n];
      const next = (cur, target, turns) => {
        let v = cur + 360 * turns;
        return v + (((target - v) % 360) + 360) % 360;
      };
      rx = next(rx, tx - 12, 2);
      ry = next(ry, ty + 12, 3);
      dice.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }

    // ---- 画面更新 ----
    const fmtTime = (ms) => {
      const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
      return h ? `${h}:${String(m % 60).padStart(2, '0')}` : `0:${String(m).padStart(2, '0')}`;
    };
    const clock = (t) => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

    function render(posOverride) {
      const pos = posOverride ?? state.pos;
      const visited = new Set(state.log.map(l => l.to));
      stEls.forEach((g, i) => {
        g.classList.toggle('visited', visited.has(i));
        g.classList.toggle('start', i === state.start);
        g.classList.toggle('current', i === pos);
      });
      moveTrain(pos);

      // 通った区間を濃く描く（一周以上なら全区間）
      const path = [];
      for (let k = 0; k <= Math.min(state.dist, N); k++) path.push(pts[(state.start + k) % N]);
      done.setAttribute('points', posOverride === undefined ? path.map(p => `${p.x},${p.y}`).join(' ') : done.getAttribute('points'));

      const name = STATIONS[pos][0];
      $('now-station').textContent = name;
      $('now-label').textContent = state.log.length ? `${state.log.length}軒目` : 'スタート駅';
      $('now-next').textContent = `次の駅は ${STATIONS[(pos + 1) % N][0]}`;
      centerBig.textContent = name;
      centerSub.textContent = state.log.length ? `${state.log.length}軒目` : 'ここから出発';

      const lap = Math.floor(state.dist / N);
      const inLap = state.dist % N;
      $('progress-fill').style.width = `${(state.dist >= N && inLap === 0 ? 100 : inLap / N * 100)}%`;
      $('progress-text').textContent = lap ? `${lap}周 + ${inLap} 駅` : `${inLap} / ${N} 駅`;
      $('progress-rest').textContent = `${lap ? lap + 1 + '周' : '一周'}まであと ${N - inLap} 駅`;

      $('st-stops').textContent = state.log.length;
      $('st-dist').textContent = state.dist;
      $('st-time').textContent = state.startedAt ? fmtTime(Date.now() - state.startedAt) : '0:00';

      const log = $('log');
      log.innerHTML = '';
      if (!state.log.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.style.display = 'block';
        li.textContent = 'サイコロを振るとここに記録されます';
        log.appendChild(li);
      }
      [...state.log].reverse().forEach((l, idx) => {
        const li = document.createElement('li');
        const n = document.createElement('span'); n.className = 'n'; n.textContent = `${state.log.length - idx}`;
        const s = document.createElement('span'); s.className = 's';
        const d = document.createElement('span'); d.className = 'd'; d.textContent = l.roll;
        s.append(d, STATIONS[l.to][0]);
        if (l.mission) { const m = document.createElement('span'); m.className = 'm'; m.textContent = l.mission; s.appendChild(m); }
        const t = document.createElement('span'); t.className = 't'; t.textContent = clock(l.at);
        li.append(n, s, t);
        log.appendChild(li);
      });

      const last = state.log[state.log.length - 1];
      $('mission').classList.toggle('show', !!(last && last.mission));
      $('mission-text').textContent = last?.mission || '';

      $('start').value = state.start;
      $('start').disabled = state.log.length > 0;
      $('opt-mission').checked = state.opts.mission;
      $('opt-lap').checked = state.opts.lap;
      $('undo').disabled = !state.log.length || busy;
      $('roll').disabled = busy;
    }

    function setStart(i) {
      state = { ...fresh(i), opts: state.opts };
      save(); render();
    }

    const wait = (ms) => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));

    async function roll() {
      if (busy) return;
      busy = true;
      $('mission').classList.remove('show');
      render();
      const n = 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 * 6);
      spinTo(n);
      if (navigator.vibrate) navigator.vibrate(30);
      await wait(1150);

      const from = state.pos;
      for (let k = 1; k <= n; k++) {
        render((from + k) % N);
        await wait(260);
      }
      const to = (from + n) % N;
      const before = state.dist;
      state.pos = to;
      state.dist += n;
      state.startedAt ??= Date.now();
      const mission = state.opts.mission ? MISSIONS[Math.floor(Math.random() * MISSIONS.length)] : null;
      state.log.push({ from, to, roll: n, at: Date.now(), mission });
      busy = false;
      save(); render();

      if (state.opts.lap && Math.floor(before / N) < Math.floor(state.dist / N)) showGoal();
    }

    function undo() {
      const last = state.log.pop();
      if (!last) return;
      state.pos = last.from;
      state.dist -= last.roll;
      if (!state.log.length) state.startedAt = null;
      save(); render();
      toast(`${STATIONS[last.to][0]} を取り消しました`);
    }

    function summary() {
      const lines = [`🍻 山手線内回り酒カスツアー（${STATIONS[state.start][0]}発）`];
      state.log.forEach((l, i) => lines.push(`${i + 1}. ${STATIONS[l.to][0]}（🎲${l.roll}）${l.mission ? ' - ' + l.mission : ''}`));
      lines.push(`計 ${state.log.length} 軒・${state.dist} 駅${state.startedAt ? '・' + fmtTime(Date.now() - state.startedAt) : ''}`);
      lines.push(location.href);
      return lines.join('\n');
    }
    async function share() {
      if (!state.log.length) return toast('まだ記録がありません');
      try { await navigator.clipboard.writeText(summary()); toast('記録をコピーしました'); }
      catch { toast('コピーできませんでした'); }
    }

    function showGoal() {
      const lap = Math.floor(state.dist / N);
      $('goal-title').textContent = lap > 1 ? `${lap}周達成！` : '一周達成！';
      $('goal-text').textContent = `${state.log.length}軒・${state.dist}駅${state.startedAt ? '・' + fmtTime(Date.now() - state.startedAt) : ''}で${STATIONS[state.start][0]}から山手線を${lap > 1 ? lap + '周' : '一周'}した。`;
      $('goal').classList.add('show');
      if (reduceMotion) return;
      const colors = ['#80c241', '#e8a317', '#c8442f', '#3a86d4', '#ffffff'];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = 2 + Math.random() * 2 + 's';
        c.style.animationDelay = Math.random() * .6 + 's';
        document.body.appendChild(c);
        c.addEventListener('animationend', () => c.remove());
      }
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ---- イベント ----
    const sel = $('start');
    STATIONS.forEach(([name], i) => sel.add(new Option(name, i)));
    sel.addEventListener('change', () => setStart(+sel.value));
    $('opt-mission').addEventListener('change', (e) => { state.opts.mission = e.target.checked; save(); });
    $('opt-lap').addEventListener('change', (e) => { state.opts.lap = e.target.checked; save(); });
    $('roll').addEventListener('click', roll);
    $('undo').addEventListener('click', undo);
    $('share').addEventListener('click', share);
    $('goal-share').addEventListener('click', share);
    const reset = () => {
      if (state.log.length && !confirm('記録を消して最初からやり直しますか？')) return;
      $('goal').classList.remove('show');
      setStart(state.start);
    };
    $('reset').addEventListener('click', reset);
    $('goal-reset').addEventListener('click', reset);
    $('goal-close').addEventListener('click', () => $('goal').classList.remove('show'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') $('goal').classList.remove('show');
      if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) { e.preventDefault(); roll(); }
    });
    setInterval(() => { if (state.startedAt) $('st-time').textContent = fmtTime(Date.now() - state.startedAt); }, 30000);

    // 再読み込みしたときは、最後に出た目をアニメーションなしで表示する
    const last = state.log[state.log.length - 1];
    if (last) {
      dice.style.transition = 'none';
      spinTo(last.roll);
      dice.getBoundingClientRect();
      dice.style.transition = '';
    }
    render();
  })();
  </script>
</body>
</html>
